<svg xmlns="http://www.w3.org/2000/svg" width="560" height="210" viewBox="0 0 560 210">
<style>text{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,'Liberation Mono','Courier New',monospace}
.run{stroke-dasharray:160 1364;animation:run 7s linear infinite;animation-delay:-5.2s}
@keyframes run{to{stroke-dashoffset:-1524}}
.cur{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.shine{animation:shine 5s ease-in-out infinite;animation-delay:2.6s}
@keyframes shine{0%,60%{transform:translateX(-200px)}100%{transform:translateX(760px)}}
</style>
<defs><linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cl"><rect x="2" y="2" width="556" height="206" rx="14"/></clipPath></defs>
<rect x="2" y="2" width="556" height="206" rx="14" fill="#000" stroke="#2a2a2a" stroke-width="1.5"/>
<g clip-path="url(#cl)"><rect class="shine" x="0" y="0" width="160" height="210" fill="url(#sh)" transform="skewX(-20)"/></g>
<rect x="2" y="2" width="556" height="206" rx="14" fill="none" stroke="#fff" stroke-width="2" class="run"/>
<text x="28" y="44" font-size="14" fill="#6e6e6e" letter-spacing="2">04 /</text>
<rect x="392.4" y="26" width="140" height="26" rx="13" fill="none" stroke="#5a5a5a"/>
<text x="462" y="44" font-size="12" fill="#cfcfcf" text-anchor="middle" letter-spacing="1.5">PRODUCTION BOT</text>
<text x="28" y="92" font-size="30" font-weight="800" fill="#fff">Youstagram Bot<tspan class="cur" fill="#fff"> _</tspan></text>
